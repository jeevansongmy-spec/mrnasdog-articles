<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
<style>
  :root { color-scheme: light dark; --ink:#111827; --muted:#6b7280; --bg:#f9fafb; --link:#b45309; }
  @media (prefers-color-scheme: dark) { :root { --ink:#e5e7eb; --muted:#9ca3af; --bg:#0f172a; --link:#fbbf24; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 64px; }
  a { color:var(--link); }
  .bar { font-size:14px; color:var(--muted); display:flex; flex-wrap:wrap; gap:6px 14px; justify-content:space-between; border-bottom:1px solid rgba(127,127,127,.25); padding-bottom:12px; margin-bottom:8px; }
  h1 { font-size:30px; line-height:1.15; letter-spacing:-.01em; }
  h2 { font-size:23px; margin-top:2em; }
  table { border-collapse:collapse; display:block; overflow-x:auto; }
  td, th { border:1px solid rgba(127,127,127,.3); padding:4px 8px; }
  img { max-width:100%; height:auto; }
  .foot { margin-top:3em; font-size:14px; color:var(--muted); border-top:1px solid rgba(127,127,127,.25); padding-top:12px; }
</style>
</head>
<body>
<main>
  <div class="bar"><a href="{{ '/' | relative_url }}">MrNasdog Research</a>{% if page.canonical_url %}<a href="{{ page.canonical_url }}">Read the original on mrnasdog.com →</a>{% endif %}</div>
  {{ content }}
  <p class="foot">{% if page.canonical_url %}Original: <a href="{{ page.canonical_url }}">{{ page.canonical_url }}</a> · {% endif %}Data + explanation only. Not financial advice.</p>
</main>
</body>
</html>
